<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>B3WM · Structure Research ATR</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121820;
      --panel-2: #0f141b;
      --border: #24303d;
      --text: #e8eef5;
      --muted: #8fa0b3;
      --green: #26a69a;
      --red: #ef5350;
      --manual: #4ea1ff;
      --leg: #ffb020;
      --bar: #28c76f;
      --accent: #5b8def;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 24, 32, 0.85);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(8px);
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
    .brand h1 span { color: var(--muted); font-weight: 500; }
    .muted { color: var(--muted); }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn, select, input[type="date"] {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      font: inherit;
    }
    .btn { cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .btn:hover { border-color: #3a4a5c; }
    .btn.primary { background: #1d2a3a; border-color: #34506f; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    .check { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; padding-bottom: 7px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      padding: 16px 20px 24px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .panel h2 { margin: 0 0 4px; font-size: 14px; letter-spacing: .2px; }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .chart-wrap {
      position: relative;
      height: min(64vh, 620px);
      min-height: 420px;
      width: 100%;
    }
    #chart { width: 100%; height: 100%; display: block; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; padding-top: 8px; color: var(--muted); font-size: 12px; }
    .legend b { color: var(--text); font-weight: 600; }
    .side { display: flex; flex-direction: column; gap: 16px; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      background: #0a0f15ee;
      border: 1px solid #33465b;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      min-width: 190px;
      z-index: 4;
      box-shadow: 0 8px 24px #0008;
    }
    .tooltip table, .data-table { width: 100%; border-collapse: collapse; }
    .tooltip td, .data-table td, .data-table th {
      padding: 3px 5px;
      text-align: right;
      border-bottom: 1px solid #ffffff0d;
      white-space: nowrap;
    }
    .tooltip td:first-child, .data-table td:first-child, .data-table th:first-child { text-align: left; }
    .data-table { font-size: 12px; }
    .data-table th { color: var(--muted); font-weight: 600; }
    .message {
      margin: 16px 20px;
      padding: 12px 14px;
      border: 1px solid #5b3a1e;
      background: #2a1d12;
      color: #ffd8a8;
      border-radius: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }
    .badge.ok { border-color: #1f5f4b; color: #7ce3bf; }
    .badge.warn { border-color: #6b4a1f; color: #ffc46b; }
    .empty { color: var(--muted); padding: 18px 0; text-align: center; }
    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; }
      .chart-wrap { height: 52vh; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>B3WM <span>Structure Research · ATR A/B</span></h1>
      <p id="status-line" class="muted">Carregando…</p>
    </div>
    <div class="toolbar">
      <a class="btn" href="/dashboard/" target="_blank" rel="noopener">Dashboard</a>
      <button class="btn primary" id="refresh" type="button">Atualizar</button>
    </div>
  </header>

  <section class="controls">
    <label class="field">Símbolo
      <select id="symbol">
        <option value="WINFUT">WINFUT</option>
        <option value="WDOFUT">WDOFUT</option>
      </select>
    </label>
    <label class="field">Timeframe
      <select id="timeframe">
        <option value="2">2 MIN</option>
        <option value="1">1 MIN</option>
        <option value="5">5 MIN</option>
        <option value="15">15 MIN</option>
        <option value="30">30 MIN</option>
        <option value="60">60 MIN</option>
      </select>
    </label>
    <label class="field">Data
      <input id="date" type="date">
    </label>
    <label class="check"><input id="show-manual" type="checkbox" checked><span class="swatch" style="background:var(--manual)"></span> Manual</label>
    <label class="check"><input id="show-leg" type="checkbox" checked><span class="swatch" style="background:var(--leg)"></span> ATR por perna</label>
    <label class="check"><input id="show-bar" type="checkbox" checked><span class="swatch" style="background:var(--bar)"></span> ATR por barra</label>
    <label class="check"><input id="show-aux" type="checkbox"> Mostrar auxiliares</label>
    <label class="check"><input id="auto" type="checkbox"> Auto 10s</label>
  </section>

  <div id="message" class="message" hidden></div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Estruturas sobrepostas</h2>
          <p id="chart-meta" class="muted">—</p>
        </div>
        <span id="ready-badge" class="badge">—</span>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <svg id="chart" role="img" aria-label="Gráfico de candles e estruturas"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <div class="legend">
        <span><b>Traço cheio:</b> UpBorder/DownBorder</span>
        <span><b>Tracejado:</b> auxiliares</span>
        <span><span class="swatch" style="background:var(--manual)"></span> manual</span>
        <span><span class="swatch" style="background:var(--leg)"></span> atr_leg</span>
        <span><span class="swatch" style="background:var(--bar)"></span> atr_bar</span>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><h2>Último candle</h2><span id="latest-count" class="badge">0</span></div>
        <div id="latest"><div class="empty">Sem dados.</div></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Relatório A/B</h2><span id="report-period" class="badge">—</span></div>
        <div id="report"><div class="empty">Sem relatório.</div></div>
      </section>
    </aside>
  </main>

  <script>
    const VARIANTS = ['manual', 'atr_leg', 'atr_bar'];
    const VARIANT_LABEL = { manual: 'Manual', atr_leg: 'ATR perna', atr_bar: 'ATR barra' };
    const COLORS = { manual: '#4ea1ff', atr_leg: '#ffb020', atr_bar: '#28c76f' };
    const numberFmt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
    const intFmt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
    const timeFmt = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const dateTimeFmt = new Intl.DateTimeFormat('pt-BR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });

    const $ = (id) => document.getElementById(id);
    const state = {
      status: null,
      points: [],
      report: null,
      chart: null,
      autoTimer: null,
      loading: false
    };

    function todayLocal() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function fmt(value, digits = 1) {
      return Number.isFinite(value)
        ? new Intl.NumberFormat('pt-BR', { maximumFractionDigits: digits }).format(value)
        : '—';
    }

    function pct(value) {
      return Number.isFinite(value) ? `${(value * 100).toFixed(1)}%` : '—';
    }

    function showMessage(text) {
      const el = $('message');
      if (!text) { el.hidden = true; el.textContent = ''; return; }
      el.hidden = false;
      el.textContent = text;
    }

    function currentQuery() {
      return {
        symbol: $('symbol').value,
        timeFrame: Number($('timeframe').value),
        date: $('date').value || todayLocal()
      };
    }

    async function getJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return await response.json();
    }

    async function load(showLoading = true) {
      if (state.loading) return;
      state.loading = true;
      const q = currentQuery();
      $('status-line').textContent = showLoading ? 'Carregando…' : $('status-line').textContent;
      if (showLoading) showMessage('');
      try {
        const base = '/api/StructureResearch';
        const date = encodeURIComponent(q.date);
        const [status, points, report] = await Promise.all([
          getJson(`${base}/GetStatus`),
          getJson(`${base}/GetPoints/${q.symbol}/${q.timeFrame}/${date}`),
          getJson(`${base}/GetReport/${q.symbol}/${q.timeFrame}/${date}`)
        ]);
        state.status = status;
        state.points = Array.isArray(points) ? points : [];
        state.report = report;
        state.loading = false;
        renderStatus();
        renderLatest();
        renderReport();
        renderChart();
        if (!state.points.length) {
          showMessage('Sem pontos de pesquisa para esta data/timeframe. Verifique se StructureResearch.Enabled=true e se o app está em Development (2MIN habilitado).');
        }
      } catch (error) {
        state.loading = false;
        state.points = [];
        state.report = null;
        renderChart();
        showMessage(`Falha ao carregar a pesquisa: ${error.message}. Confirme se o app está rodando e se o endpoint responde.`);
      }
    }

    function renderStatus() {
      const s = state.status;
      if (!s) { $('status-line').textContent = 'Status indisponível.'; $('ready-badge').textContent = 'off'; return; }
      const enabled = !!s.enabled;
      $('ready-badge').className = `badge ${enabled ? 'ok' : 'warn'}`;
      $('ready-badge').textContent = enabled ? 'enabled' : 'disabled';
      $('status-line').textContent =
        `Enabled=${enabled} · ATR=${s.atrPeriod} · WIN×${s.multipliers?.winfut ?? '?'} · WDO×${s.multipliers?.wdofut ?? '?'} · ` +
        `TFs=[${(s.timeFrames || []).join(', ')}]`;
      if (!enabled) {
        showMessage('StructureResearch está desligado. Ative em appsettings.Development.json (Enabled=true) e reinicie o app.');
      }
    }

    function renderLatest() {
      const latest = {};
      for (const point of state.points) latest[point.variant] = point;
      const rows = VARIANTS.filter(v => latest[v]).map(v => {
        const p = latest[v];
        return `<tr>
          <td><span class="swatch" style="background:${COLORS[v]}"></span> ${VARIANT_LABEL[v]}</td>
          <td>${fmt(p.upBorder)}</td>
          <td>${fmt(p.downBorder)}</td>
          <td>${fmt(p.rangeUsed)}</td>
          <td>${fmt(p.atr)}</td>
          <td>${p.upChanged || p.downChanged ? 'sim' : ''}</td>
        </tr>`;
      }).join('');
      $('latest-count').textContent = String(Object.keys(latest).length);
      $('latest').innerHTML = rows
        ? `<table class="data-table"><thead><tr><th>Variante</th><th>Up</th><th>Down</th><th>Range</th><th>ATR</th><th>Chg</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty">Sem dados.</div>';
    }

    function renderReport() {
      const report = state.report;
      const variants = report?.variants || [];
      $('report-period').textContent = report ? `ATR ${report.atrPeriod} · k ${fmt(report.atrMultiplier, 2)}` : '—';
      if (!variants.length) {
        $('report').innerHTML = '<div class="empty">Sem relatório para esta data.</div>';
        return;
      }
      const rows = variants.map(v => `<tr>
        <td><span class="swatch" style="background:${COLORS[v.variant] || '#888'}"></span> ${VARIANT_LABEL[v.variant] || v.variant}</td>
        <td>${intFmt.format(v.upChanges || 0)}</td>
        <td>${intFmt.format(v.downChanges || 0)}</td>
        <td>${fmt(v.avgLegBars, 1)}</td>
        <td>${pct(v.falseBreakRateShort)}</td>
        <td>${pct(v.falseBreakRateLong)}</td>
        <td>${intFmt.format(v.changesNotMatchedManual || 0)}</td>
      </tr>`).join('');
      $('report').innerHTML = `<table class="data-table"><thead><tr>
        <th>Variante</th><th>Up</th><th>Down</th><th>Perna</th><th>FB10</th><th>FB20</th><th>Div</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    function groupPoints() {
      const groups = {};
      for (const variant of VARIANTS) {
        groups[variant] = state.points
          .filter(p => p.variant === variant)
          .sort((a, b) => new Date(a.date) - new Date(b.date));
      }
      return groups;
    }

    function renderChart() {
      const svg = $('chart');
      const wrap = $('chart-wrap');
      const groups = groupPoints();
      const visible = VARIANTS.filter(v => {
        if (v === 'manual') return $('show-manual').checked;
        if (v === 'atr_leg') return $('show-leg').checked;
        return $('show-bar').checked;
      });
      const reference = groups.manual.length
        ? groups.manual
        : (groups[VARIANTS.find(v => groups[v].length)] || []);

      if (!reference.length || !visible.length) {
        svg.innerHTML = '';
        state.chart = null;
        $('chart-meta').textContent = reference.length
          ? 'Selecione ao menos uma variante.'
          : 'Sem candles/pontos para desenhar.';
        return;
      }

      const W = Math.max(640, wrap.clientWidth);
      const H = Math.max(420, wrap.clientHeight || 520);
      const margin = { left: 66, right: 18, top: 18, bottom: 34 };
      const plotW = W - margin.left - margin.right;
      const plotH = H - margin.top - margin.bottom;
      const n = reference.length;

      let min = Infinity;
      let max = -Infinity;
      for (const bar of reference) {
        min = Math.min(min, bar.low);
        max = Math.max(max, bar.high);
      }
      const showAux = $('show-aux').checked;
      for (const variant of visible) {
        for (const p of groups[variant]) {
          min = Math.min(min, p.downBorder);
          max = Math.max(max, p.upBorder);
          if (showAux) {
            min = Math.min(min, p.downAuxBorder);
            max = Math.max(max, p.upAuxBorder);
          }
        }
      }
      if (!Number.isFinite(min) || !Number.isFinite(max) || min === max) {
        min = (min || 0) - 1;
        max = (max || 0) + 1;
      }
      const pad = (max - min) * 0.04;
      min -= pad;
      max += pad;

      const x = (i) => margin.left + (i + 0.5) * plotW / n;
      const y = (value) => margin.top + (max - value) / (max - min) * plotH;
      const barWidth = Math.max(1, Math.min(9, plotW / n * 0.62));

      let html = '';
      // fundo e grade
      html += `<rect x="0" y="0" width="${W}" height="${H}" fill="#0b0f14"/>`;
      for (let k = 0; k <= 4; k++) {
        const value = max - (max - min) * k / 4;
        const yy = y(value);
        html += `<line x1="${margin.left}" y1="${yy}" x2="${W - margin.right}" y2="${yy}" stroke="#ffffff12" stroke-width="1"/>`;
        html += `<text x="${margin.left - 8}" y="${yy + 4}" fill="#8fa0b3" font-size="11" text-anchor="end">${fmt(value, 0)}</text>`;
      }

      // candles
      for (let i = 0; i < n; i++) {
        const bar = reference[i];
        const cx = x(i);
        const up = bar.close >= bar.open;
        const color = up ? '#26a69a' : '#ef5350';
        html += `<line x1="${cx}" y1="${y(bar.high)}" x2="${cx}" y2="${y(bar.low)}" stroke="${color}" stroke-width="1" opacity="0.85"/>`;
        const top = Math.min(y(bar.open), y(bar.close));
        const height = Math.max(1, Math.abs(y(bar.open) - y(bar.close)));
        html += `<rect x="${cx - barWidth / 2}" y="${top}" width="${barWidth}" height="${height}" fill="${color}" opacity="0.8"/>`;
      }

      // estrutura
      for (const variant of visible) {
        const points = groups[variant];
        if (!points.length) continue;
        const color = COLORS[variant];
        const step = (key, dashed, opacity) => {
          let d = '';
          for (let i = 0; i < points.length; i++) {
            const px = x(i);
            const py = y(points[i][key]);
            if (i === 0) d += `M ${px} ${py}`;
            else d += ` L ${px} ${y(points[i - 1][key])} L ${px} ${py}`;
          }
          if (points.length > 0) {
            d += ` L ${x(points.length - 1) + plotW / n / 2} ${y(points[points.length - 1][key])}`;
          }
          return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${dashed ? 1 : 1.7}" stroke-dasharray="${dashed ? '4 3' : ''}" opacity="${opacity}"/>`;
        };
        html += step('upBorder', false, 0.95);
        html += step('downBorder', false, 0.95);
        if (showAux) {
          html += step('upAuxBorder', true, 0.55);
          html += step('downAuxBorder', true, 0.55);
        }
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const title = `${VARIANT_LABEL[variant]} ${dateTimeFmt.format(new Date(p.date))} · range=${fmt(p.rangeUsed)} atr=${fmt(p.atr)}`;
          if (p.upChanged) {
            html += `<circle cx="${x(i)}" cy="${y(p.upBorder)}" r="2.6" fill="${color}" stroke="#0b0f14" stroke-width="1"><title>${title} · UP</title></circle>`;
          }
          if (p.downChanged) {
            html += `<circle cx="${x(i)}" cy="${y(p.downBorder)}" r="2.6" fill="${color}" stroke="#0b0f14" stroke-width="1"><title>${title} · DOWN</title></circle>`;
          }
        }
      }

      // eixo X
      const labels = Math.min(6, n);
      for (let k = 0; k < labels; k++) {
        const index = Math.round(k * (n - 1) / Math.max(1, labels - 1));
        const bar = reference[index];
        html += `<text x="${x(index)}" y="${H - 12}" fill="#8fa0b3" font-size="11" text-anchor="middle">${timeFmt.format(new Date(bar.date))}</text>`;
      }

      html += `<line id="crosshair" x1="0" y1="${margin.top}" x2="0" y2="${H - margin.bottom}" stroke="#ffffff55" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = html;

      state.chart = {
        W, H, n, margin, plotW, plotH, x, reference, groups, visible
      };

      $('chart-meta').textContent =
        `${reference[0].date.slice(0, 10)} · ${n} candles · ` +
        `${visible.map(v => VARIANT_LABEL[v]).join(' × ')}`;
    }

    function onChartMove(event) {
      const chart = state.chart;
      const svg = $('chart');
      const wrap = $('chart-wrap');
      if (!chart) return;
      const rect = svg.getBoundingClientRect();
      const scale = chart.W / rect.width;
      const px = (event.clientX - rect.left) * scale;
      if (px < chart.margin.left || px > chart.W - chart.margin.right) {
        hideTooltip();
        return;
      }
      const index = Math.max(0, Math.min(chart.n - 1, Math.floor((px - chart.margin.left) / chart.plotW * chart.n)));
      const cx = chart.x(index);
      const crosshair = $('crosshair');
      if (crosshair) {
        crosshair.setAttribute('x1', cx);
        crosshair.setAttribute('x2', cx);
        crosshair.setAttribute('visibility', 'visible');
      }

      const bar = chart.reference[index];
      const rows = chart.visible.map(variant => {
        const p = (chart.groups[variant] || [])[index];
        if (!p) return '';
        return `<tr><td><span class="swatch" style="background:${COLORS[variant]}"></span> ${VARIANT_LABEL[variant]}</td>` +
          `<td>${fmt(p.upBorder)} / ${fmt(p.downBorder)}</td><td>${fmt(p.rangeUsed)}</td><td>${fmt(p.atr)}</td></tr>`;
      }).join('');

      const tooltip = $('tooltip');
      tooltip.innerHTML = `<div class="muted">${dateTimeFmt.format(new Date(bar.date))}</div>` +
        `<div>O ${fmt(bar.open)} · H ${fmt(bar.high)} · L ${fmt(bar.low)} · C ${fmt(bar.close)}</div>` +
        `<table>${rows}</table>`;
      tooltip.hidden = false;
      const wrapRect = wrap.getBoundingClientRect();
      const left = Math.min(event.clientX - wrapRect.left + 14, wrapRect.width - 220);
      const top = Math.min(event.clientY - wrapRect.top + 14, wrapRect.height - 120);
      tooltip.style.left = `${Math.max(4, left)}px`;
      tooltip.style.top = `${Math.max(4, top)}px`;
    }

    function hideTooltip() {
      $('tooltip').hidden = true;
      const crosshair = $('crosshair');
      if (crosshair) crosshair.setAttribute('visibility', 'hidden');
    }

    function setup() {
      $('date').value = todayLocal();
      $('refresh').addEventListener('click', () => load(true));
      $('symbol').addEventListener('change', () => load(true));
      $('timeframe').addEventListener('change', () => load(true));
      $('date').addEventListener('change', () => load(true));
      for (const id of ['show-manual', 'show-leg', 'show-bar', 'show-aux']) {
        $(id).addEventListener('change', renderChart);
      }
      $('auto').addEventListener('change', () => {
        if (state.autoTimer) {
          clearInterval(state.autoTimer);
          state.autoTimer = null;
        }
        if ($('auto').checked) {
          state.autoTimer = setInterval(() => load(false), 10000);
        }
      });
      $('chart-wrap').addEventListener('mousemove', onChartMove);
      $('chart-wrap').addEventListener('mouseleave', hideTooltip);
      new ResizeObserver(() => renderChart()).observe($('chart-wrap'));
      load(true);
    }

    setup();
  </script>
</body>
</html>
